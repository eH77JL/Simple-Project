name: servicenow-pipeline

on: [push]

# Crucial for ServiceNow tracking to keep job IDs consistent
jobs:

  # STAGE 1: BUILD
  Build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Compile and Package
      run: |
        echo "Compiling code..."
        echo "Creating artifact package..."

  # STAGE 2: TEST
  Test:
    runs-on: ubuntu-latest
    needs: Build # Ensures Test only runs if Build succeeds
    steps:
    - name: Run Unit Tests
      run: echo "Running unit tests... 100% passed."

    - name: Run Security Scan
      run: echo "Running SonarQube / Veracode security compliance scan..."

  # STAGE 3: DEPLOY TO TEST/STAGE (ServiceNow tracks this as the change trigger)
  DeployToStage:
    runs-on: ubuntu-latest
    needs: Test
    steps:
    - name: Deploy to Staging Environment
      run: echo "Deploying code to non-production staging environment..."

  # STAGE 4: SERVICENOW CHANGE GATE (The manual/automated approval step)
  ServiceNowChangeGate:
    runs-on: ubuntu-latest
    needs: DeployToStage
    steps:
    - name: ServiceNow DevOps Change Action
      # Using the official ServiceNow Marketplace Action
      uses: ServiceNow/servicenow-devops-change@v6.1.0
      id: create
      with:
        context-github: ${{ toJSON(github) }}
        job-name: 'ServiceNowChangeGate'
        # Credentials you would set up in your GitHub Secrets
        devops-integration-token: ${{ secrets.SN_DEVOPS_TOKEN }}
        instance-url: ${{ secrets.SN_INSTANCE_URL }}
        tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
        
        # Details sent directly to ServiceNow to auto-populate the Change Ticket
        change-request: |
          {
              "setCloseCode": "true",
              "attributes": {
                  "short_description": "Automated Software Deployment 26 Oct 2026",
                  "description": "Automated Software Deployment.",
                  "assignment_group": "a715cd759f2002002920bde8132e7018",
                  "implementation_plan": "Software update is tested and results can be found in Test Summaries Tab; When the change is approved the implementation happens automated by the CICD pipeline within the change planned start and end time window.",
                  "backout_plan": "When software fails in production, the previous software release will be re-deployed.",
                  "test_plan": "Testing if the software was successfully deployed",
                  "chg_model": "adffaa9e4370211072b7f6be5bb8f2ed",
                  "devops_change": "true"
              }
          }
         # Deduct indentation so these properties align directly under "with:"
        interval: '100'
        timeout: '3600'
        changeCreationTimeOut: '3600'
        abortOnChangeCreationFailure: true
        abortOnChangeStepTimeout: true
    - name: Output of Change Creation
      run: |
        echo "Successfully tracked change request!"
        echo "Ticket Number: ${{ steps.create.outputs.change-request-number }}"
        echo "Sys ID: ${{ steps.create.outputs.change-request-sys-id }}"

  # STAGE 5: PRODUCTION DEPLOYMENT
  DeployToProduction:
    runs-on: ubuntu-latest
    needs: ServiceNowChangeGate # Will NOT run until ServiceNow approves the step above
    steps:
    - name: Deploy to Live Prod Server
      run: |
        echo "ServiceNow approved! Deploying to Production..."
        echo "Deployment complete and live."
